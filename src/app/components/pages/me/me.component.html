<div class="flex-col flex-1 h-full">
	<div class="h-full" id="sect1">
		<div class="flex justify-center h-1/3 text-white">
			<div class="flex flex-col w-1/2">
				<div>
					<p class="font-mono text-2xl py-4">whoami</p>
				</div>
				<div class="flex flex-1">
					<ul>
						<li>Sahin Tekes</li>
						<li>Sahin Tekes</li>
						<li>Sahin Tekes</li>
						<li>Sahin Tekes</li>
					</ul>
				</div>
			</div>
		</div>
		<div class="h-2/3 bg-yellow-300">
			<div class="flex flex-col flex-1 justify-center items-center text-white">
				<div class="flex flex-col w-1/2 bg-purple-300">
					<div>
						<p class="font-mono text-2xl py-4">skills <span (click)="alphabetd()">dalph</span> <span (click)="alphabet()">alph</span>  <span (click)="asc()">up</span> <span (click)="desc()">down</span></p>
					</div>
				</div>
				<div class="flex flex-1 justify-center xl:justify-start flex-row flex-wrap h-full w-full bg-green-300 gap-4 p-4">
					<div *ngFor="let skill of skills" class="flex flex-col justify-center items-center rounded-2xl w-[100px] h-[100px] bg-purple-300 p-2">
						<div class="flex h-1/4 items-center">
							<span class="text-xs">{{skill.tool}}</span>
						</div>
						<div class="flex h-2/4 justify-center">
							<img src="{{skill.logo}}" alt="" class="flex">
						</div>
						<div class="flex h-1/4 items-center gap-2">
							<div *ngFor="let rating of counter(skill.rating)" class="rounded-full h-3 w-3 flex items-center justify-center bg-red-500"></div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
