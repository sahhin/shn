<div class=" flex flex-col p-4 w-full xl:w-1/3 md:w-1/2 m-auto justify-center text-white gap-4">
	<div class="flex flex-col w-full bg-gray-500 rounded-lg p-4 shadow-lg border-solid border-[3px] border-gray-700">
		<h1 class="text-2xl font-bold">{{'settings.language.header' | translate}}</h1>
		<div class="pt-4">
			<mat-form-field appearance="fill" class="w-full text-white">
				<mat-label>{{'settings.language.label'|translate}}</mat-label>
				<mat-select #langSelect (selectionChange)="changeLang(langSelect.value)"
							[value]="translate.currentLang">
					<mat-option *ngFor="let lang of translate.getLangs()" [value]="lang">
						{{'settings.language.languages.' + lang|translate}}
					</mat-option>
				</mat-select>
			</mat-form-field>
		</div>
	</div>

</div>
