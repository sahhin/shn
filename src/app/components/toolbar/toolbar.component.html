<header class="bg-gray-800 sticky top-0 min-h-[75px] max-h-[75px] flex flex-row xl:rounded-t-lg">
	<div class="flex flex-1 p-4">
		<img routerLink="" src="assets/img/logo.svg" alt=""
			 class="h-full cursor-pointer transition-all duration-500 ease-in-out hover:drop-shadow-white">
	</div>
	<div class="p-4 flex flex-row items-center justify-end gap-4 text-white">
		<span routerLink="" class="cursor-pointer hidden xl:block">{{'navigation.start' | translate | uppercase}}</span>
		<span routerLink="me" class="cursor-pointer hidden xl:block">{{'navigation.me' | translate | uppercase}}</span>
		<span routerLink="portfolio"
			  class="cursor-pointer hidden xl:block">{{'navigation.portfolio' | translate | uppercase}}</span>
		<fa-icon [icon]="faBars" class="xl:hidden" (click)="drawer?.toggle()"></fa-icon>
		<fa-icon routerLink="settings" style="transform-origin: center center" [icon]="faCog"
				 class="flex cursor-pointer hover:motion-safe:animate-spin-slow transition-all text-2xl"></fa-icon>

	</div>

</header>
